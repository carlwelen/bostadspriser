[project]
name = "scraper"
version = "0.1.0"
description = "Hemnet/Booli scraper for inner-city Stockholm housing prices"
authors = [{ name = "Carl Welén", email = "carl.welen@outlook.com" }]
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.50.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "httpx>=0.28.1",
    "click>=8.1.7",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.3",
    "tenacity>=9.0.0",
]

[project.scripts]
scraper = "scraper.run:cli"

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
